[package]
name = "entroq-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

# `libc` reaches the one host fact no Rust standard library call exposes: the resident-set
# high-water mark of a process. Nothing else is needed: the tool drives the codec through its
# public API and compares bytes, so it owns no hash and no serialization dependency.
[dependencies]
codec = { path = "../../codec" }
libc = "0.2"

[lints]
workspace = true
