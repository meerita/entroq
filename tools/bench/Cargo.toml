[package]
name = "entroq-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# The laboratory records the checksum of every library a result was produced with.
# Entroq does not own a hash primitive that serves that purpose.
#
# `libc` reaches the host facts no Rust standard library call exposes: the resident-set
# high-water mark, the performance counter system call, and the allocator the C libraries
# call. `serde_json` writes the machine-readable result. Neither enters a codec crate.
#
# The competitor libraries are linked by `build.rs` from the laboratory, not declared here.
# They are build inputs produced outside this repository, so no version of them appears in
# the lock file.
#
# `codec` is the subject. A comparison measures both sides through the same boundary, so the
# harness drives Entroq in-process through its own crate exactly as it drives a competitor
# through the library that project publishes.
[dependencies]
codec = { path = "../../codec" }
libc = "0.2"
serde_json = "1"
sha2 = "0.10"

# The build script hashes each library it points the linker at, so the binary carries the
# checksum of what it actually linked.
[build-dependencies]
sha2 = "0.10"

[lints]
workspace = true
